services:
  speechtoplan:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: speechtoplan:latest
    container_name: speechtoplan
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEVICE: cuda
      ASR_MODEL_SIZE: tiny
      ASR_COMPUTE_TYPE: int8
      LLM_MODEL_PATH: google/functiongemma-270m-it
      LLM_QUANT: int4
      EMOTION_MODEL: superb/wav2vec2-base-superb-er
      BOT_TMP_DIR: /tmp/voice
      # Если есть LoRA-адаптер для LLM — раскомментировать:
      # LLM_ADAPTER_PATH: /models/adapters/best_adapter
    volumes:
      - hf_cache:/models/hf
      - ./checkpoints:/models/adapters:ro
      - voice_tmp:/tmp/voice
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Альтернативный синтаксис, если runtime nvidia настроен явно:
    # runtime: nvidia
    # gpus: all

volumes:
  hf_cache:
  voice_tmp:
