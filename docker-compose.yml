# Docker-compose только для Telegram-бота.
# ML-сервис (asr_emotion + llm) запускается на ХОСТЕ напрямую с GPU
# (см. docs/SETUP.md). Бот ходит к нему через host.docker.internal:8000.
services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: speechtoplan-bot:latest
    container_name: speechtoplan-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://host.docker.internal:8000}
      ML_REQUEST_TIMEOUT: ${ML_REQUEST_TIMEOUT:-120}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-120}
      BOT_TMP_DIR: /tmp/voice
    extra_hosts:
      # Linux-хосты не знают host.docker.internal по умолчанию.
      # Docker Desktop (Win/Mac) добавляет автоматически — здесь дублируем для Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - voice_tmp:/tmp/voice

volumes:
  voice_tmp:
